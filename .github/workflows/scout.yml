name: Furniture scout

on:
  schedule:
    - cron: "52 7 * * *"   # daily 07:52 Reykjavík time (UTC)
  workflow_dispatch:
  push:
    paths: ["refs/**", "config.yaml", "scout/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scout
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scout.run
      - name: Commit results
        run: |
          git config user.name "furniture-scout"
          git config user.email "actions@users.noreply.github.com"
          git add results.md data/
          git diff --cached --quiet || git commit -m "Scout results $(date -u +%F)"
          git pull --rebase --autostash && git push
